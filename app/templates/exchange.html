{% extends "layout.html" %}

{% block content %}
<div class="container-fluid py-3">

    <div class="row g-2">
        <!-- 左侧：窄版资源列表 (侧栏) -->
        <div class="col-lg-2 col-md-3">
            <div class="card shadow-sm h-100 bg-white">
                <div class="card-header bg-light py-2 border-bottom">
                    <span class="small fw-bold text-muted"><i class="bi bi-list-ul me-1"></i> 市场行情</span>
                </div>
                <!-- 滚动容器 -->
                <div id="resource-category-list" class="list-group list-group-flush overflow-auto"
                    style="max-height: 85vh; font-size: 0.8rem;">
                    <!-- JS 动态填充 -->
                </div>
            </div>
        </div>

        <div class="col-lg-10 col-md-9">
            <div class="card shadow-sm bg-white">
                <div class="card-body py-2 d-flex align-items-center gap-4">
                    <div>
                        <small class="text-muted d-block">当前品种</small>
                        <strong class="fs-5" id="resource_name">加载中...</strong>
                    </div>
                    <div class="border-start ps-4">
                        <small class="text-muted d-block">最新成交价</small>
                        <strong class="fs-4 text-success" id="least_market_price">$0.000</strong>
                    </div>
                    <div class="border-start ps-4">
                        <small class="text-muted d-block">24H 涨跌</small>
                        <span class="text-danger" id="price_change">+0.00%</strong>
                    </div>
                    <div class="border-start ps-4">
                        <small class="text-muted d-block">基准价格</small>
                        <span class="fw-bold text-secondary" id="base_price">$0.000</span>
                    </div>
                </div>
            </div>
            <div class="row g-2">
                <div class="col-lg-9">
                    <div class="card shadow-sm" style="height: 500px; overflow: hidden;">
                        <!-- 头部紧凑排列 -->
                        <div class="card-header bg-white d-flex justify-content-between align-items-center py-1 px-3">
                            <h6 class="mb-0 fw-bold">实时行情</h6>
                            <div class="btn-group btn-group-sm" id="chart-tabs">
                                <button class="btn btn-light border-0 active" data-type="1">1分</button>
                                <button class="btn btn-light border-0" data-type="5">5分</button>
                            </div>
                        </div>
                        <!-- 图表容器直接填满剩余空间 -->
                        <div class="card-body p-0" style="flex: 1;">
                            <div id="price-chart" style="width: 100%; height: 100%;"></div>
                        </div>
                    </div>
                </div>


                <div class="col-lg-3">
                    <div class="card shadow-sm " style="height: 500px;">
                        <!-- 顶部行情概览 -->
                        <div class="card-header bg-white py-2 border-bottom-0">
                            orderbook
                        </div>

                        <!-- 盘口五档 (Orderbook) -->
                        <div class="card-body p-0 border-top border-bottom">
                            <div class="orderbook-container small">
                                <!-- 卖盘 (Asks) - 从卖五到卖一倒序排列 -->
                                <div class="asks-section border-bottom pb-1">
                                    <table class="table table-sm table-borderless mb-0">
                                        <tbody id="asks-body">
                                        </tbody>
                                    </table>
                                </div>

                                <!-- 买盘 (Bids) - 从买一到买五正序排列 -->
                                <div class="bids-section pt-1">
                                    <table class="table table-sm table-borderless mb-0">
                                        <tbody id="bids-body">
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- 底部快捷下单表单 -->
                        <div class="card-footer bg-white border-0 p-3">
                            <div class="row g-2 ">
                                <div class="col-12">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-0">单价</span>
                                        <input type="number" class="form-control border-light" id="order_price"
                                            step="0.001" placeholder="0.000">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text bg-light border-0">数量</span>
                                        <input type="number" class="form-control border-light" id="order_qty"
                                            placeholder="0">
                                    </div>
                                </div>
                                <div class="col-6">
                                    <button class="btn btn-danger btn-sm w-100 fw-bold"
                                        onclick="submitOrder('sell')">卖出</button>
                                </div>
                                <div class="col-6">
                                    <button class="btn btn-success btn-sm w-100 fw-bold"
                                        onclick="submitOrder('buy')">买入</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>




</div>
{% endblock %}

{% block scripts %}
<script>
    const chart = echarts.init(document.getElementById('price-chart'));

    // 状态管理
    let currentInterval = 1; // 默认 1 分钟
    let kData = []; // 存储原始 API 数据对象

    const COLORS = {
        up: '#ef232a',
        down: '#14b143',
        vol: '#7fbe9e'
    };

    // 生成 K 线配置
    const getKLineOption = (apiData) => {
        const dates = apiData.map(item => new Date(item.time * 1000).toLocaleString());
        const candlestickData = apiData.map(item => [
            item.open || item.low,
            item.close || item.high,
            item.low,
            item.high
        ]);

        return {
            grid: [
                // 两个区域：上面价格走势；下面成交量走势
                { left: '3%', right: '10%', height: '60%', top: '10%', containLabel: true },
                { left: '3%', right: '10%', top: '75%', height: '15%', containLabel: true }
            ],
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'cross' },
                formatter: (params) => {
                    const p = params[0];
                    if (!p || !p.data) return '';
                    // p.data 格式: [index, open, close, low, high]
                    const data = p.data;
                    return `时间: ${p.name}<br/>` +
                        `开盘: ${data[1]}<br/>` +
                        `收盘: ${data[2]}<br/>` +
                        `最低: ${data[3]}<br/>` +
                        `最高: ${data[4]}`;
                }
            },
            xAxis: [
                // 共享dates数据作为x轴
                { type: 'category', data: dates, boundaryGap: true, axisLine: { onZero: false } },
                { type: 'category', gridIndex: 1, data: dates, axisLabel: { show: false } }
            ],
            yAxis: [
                { scale: true, position: 'right' },
                { scale: true, gridIndex: 1, splitNumber: 2, axisLabel: { show: false }, axisTick: { show: false }, splitLine: { show: false } }
            ],
            dataZoom: [{ type: 'inside', xAxisIndex: [0, 1], start: 70, end: 100 }, { type: 'slider', xAxisIndex: [0, 1], top: '92%' }],
            series: [
                {
                    name: 'K线',
                    type: 'candlestick',
                    data: candlestickData,
                    itemStyle: { color: COLORS.up, color0: COLORS.down, borderColor: COLORS.up, borderColor0: COLORS.down }
                },
                {
                    name: '成交量',
                    type: 'bar',
                    xAxisIndex: 1,
                    yAxisIndex: 1,
                    data: apiData.map(item => item.volume),
                    itemStyle: {
                        color: (params) => {
                            // 如果收盘大于开盘，为红色
                            const item = apiData[params.dataIndex];
                            return (item.close >= item.open) ? COLORS.up : COLORS.down;
                        }
                    }
                }
            ]
        };
    };

    // 核心切换函数
    async function switchChart(interval) {
        currentInterval = parseInt(interval);
        const resourceId = 2; // 建议动态获取
        try {
            const res = await fetch(`/api/exchange/history/${resourceId}?interval_minutes=${currentInterval}`);
            const json = await res.json();
            kData = json.data; // 保存原始数据用于实时更新
            chart.setOption(getKLineOption(kData), true);
        } catch (err) {
            console.error("加载 K 线失败:", err);
        }
    }

    // 实时成交更新逻辑
    function onNewTrade(timestamp, price) {
        if (kData.length === 0) return;

        const lastBar = kData[kData.length - 1];
        const barInterval = currentInterval * 60; // 转为秒

        // 判断是否需要开启新的一根柱子
        if (timestamp >= lastBar.time + barInterval) {
            // 刷新全量数据（最稳妥，防止多根柱子缺失）
            switchChart(currentInterval);
        } else {
            // 更新当前最后一根柱子（收盘价、最高、最低、成交量）
            lastBar.close = price;
            if (price > lastBar.high) lastBar.high = price;
            if (price < lastBar.low) lastBar.low = price;
            // 简单累加成交量（如果 WS 传了 quantity 也可以加上）

            // 增量更新图表
            const candlestickData = kData.map(item => [item.open || item.low, item.close || item.high, item.low, item.high]);
            const volumeData = kData.map(item => item.volume);

            chart.setOption({
                series: [
                    { data: candlestickData },
                    { data: volumeData }
                ]
            });
        }
    }

    // 事件绑定
    document.getElementById('chart-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;

        document.querySelectorAll('#chart-tabs button').forEach(b => b.classList.remove('active', 'btn-primary'));
        btn.classList.add('active', 'btn-primary');

        // 按钮 dataset.type 传数字，如 "1", "5", "60"
        switchChart(btn.dataset.type);
    });

    // 初始化默认加载 1 分钟 K 线
    switchChart(1);
    window.addEventListener('resize', () => chart.resize());
</script>


<script>
    function renderResourceSidebar() {
        const container = document.getElementById('resource-category-list');
        const resources = window.gameData.resources;

        // 按行业分组
        const grouped = resources.reduce((acc, res) => {
            const category = res.industry_id || '其他';
            if (!acc[category]) acc[category] = [];
            acc[category].push(res);
            return acc;
        }, {});

        const html = Object.entries(grouped).map(([category, items]) => {
            // 行业小标题
            const headerHtml = `
            <div class="bg-light px-3 py-1 small text-uppercase fw-bold text-muted border-bottom" style="font-size: 0.7rem;">
                ${category}
            </div>`;

            // 资源行
            const itemsHtml = items.map(res => {
                // 假设我们能拿到简易价格，拿不到就显示 --
                const price = res.last_price || '--';
                const isSelected = res.id === window.currentResourceId;

                return `
                <a href="javascript:void(0)" 
                   onclick="selectExchangeResource(${res.id})"
                   class="list-group-item list-group-item-action market-item border-0 ${isSelected ? 'active' : ''}"
                   data-res-id="${res.id}">
                    <div class="d-flex justify-content-between align-items-center">
                        <span>${res.name}</span>
                        <span class="${price !== '--' ? 'text-primary' : 'text-muted'} fw-normal">${price}</span>
                    </div>
                </a>
            `;
            }).join('');

            return headerHtml + itemsHtml;
        }).join('');

        container.innerHTML = html;
    }



    function selectExchangeResource(resourceId) {
        // 1. 找到之前那个 active 的元素，把它打回原形
        console.log("Selecet exchange change", resourceId)
        const prevActive = document.querySelector('#resource-category-list .active');
        if (prevActive) {
            prevActive.classList.remove('active');
            // 如果你有 badge 变色逻辑，也在这里改
            const badge = prevActive.querySelector('.badge');
            if (badge) {
                badge.classList.replace('bg-white', 'bg-light');
                badge.classList.add('text-muted');
            }
        }

        // 2. 找到当前被点击的元素，给它穿上 active 外衣
        // 使用属性选择器精准定位 data-res-id
        const current = document.querySelector(`#resource-category-list [data-res-id="${resourceId}"]`);
        if (current) {
            current.classList.add('active');
            const badge = current.querySelector('.badge');
            if (badge) {
                badge.classList.replace('bg-light', 'bg-white');
                badge.classList.remove('text-muted');
            }
        }
        // 3. 更新全局变量 & 触发数据请求
        gameWS.send("exchange", "switch_resource", JSON.stringify({
            "resource_id": resourceId
        }))
    }

    function renderPriceInfo(data) {
        const resource_id = data["resource_id"];
        const price_info = data['price_info']

        const resource = window.gameData.resources.find(r => r.id === resource_id)
        document.querySelector("#resource_name").innerText = `${resource.name}`;
        document.querySelector("#least_market_price").innerText = `$${price_info["last_price"]}`;
        // document.querySelector("#base_price").innerText = `$${price["base_price"].toFixed(3)}`;
    }

    /**
     * 动态渲染盘口数据
     * @param {Array} orders - 从后端 CRUD 接口获取的订单数组
     */
    function renderOrderBook(data) {

        const player = getUserInfo()
        const myId = player.id;

        // 3. 数据处理
        const orders = data['orders'];
        const rawAsks = orders['asks'] || []; // 假设后端返回 [卖1, 卖2, ...]
        const rawBids = orders['bids'] || []; // 假设后端返回 [买1, 买2, ...]

        // 股票逻辑：卖单取前5档并【翻转】，让卖五在顶，卖一在下
        const displayAsks = rawAsks.slice(0, 5).reverse();
        // 买单取前5档，买一在顶，买五在下
        const displayBids = rawBids.slice(0, 5);

        // 4. 渲染卖单 (Asks)
        const askBody = document.querySelector('#asks-body');
        askBody.innerHTML = displayAsks.map((order, index) => {
            const isMine = order.player_id === myId;
            const level = displayAsks.length - index; // 计算 卖五...卖一
            const rowClass = isMine ? 'bg-warning bg-opacity-25' : '';

            return `
            <tr class="cursor-pointer ${rowClass}" onclick="fillOrderForm('buy', ${order.price_per_unit})">
                <td class="text-muted small">卖${level}</td>
                <td class="fw-bold text-danger text-center">$${order.price_per_unit.toFixed(3)}</td>
                <td class="text-end pe-2">${order.quantity.toLocaleString()} ${isMine ? '⭐' : ''}</td>
            </tr>
        `;
        }).join('') || '<tr><td colspan="3" class="text-center text-muted py-2">无卖单</td></tr>';

        // 5. 渲染买单 (Bids)
        const bidBody = document.querySelector('#bids-body');
        bidBody.innerHTML = displayBids.map((order, index) => {
            const isMine = order.player_id === myId;
            const level = index + 1; // 计算 买一...买五
            const rowClass = isMine ? 'bg-warning bg-opacity-25' : '';

            return `
            <tr class="cursor-pointer ${rowClass}" onclick="fillOrderForm('sell', ${order.price_per_unit})">
                <td class="text-muted small">买${level}</td>
                <td class="fw-bold text-success text-center">$${order.price_per_unit.toFixed(3)}</td>
                <td class="text-end pe-2">${order.quantity.toLocaleString()} ${isMine ? '⭐' : ''}</td>
            </tr>
        `;
        }).join('') || '<tr><td colspan="3" class="text-center text-muted py-2">无买单</td></tr>';
    }


    document.addEventListener('DOMContentLoaded', async () => {
        await window.gameDataPromise
        renderResourceSidebar();

    });

</script>

</script>
<script>
    async function submitOrder(type) {
        const btn = event.target;
        const form = btn.closest('.card-footer');
        console.log(form);

        const price = parseFloat(form.querySelectorAll('input')[0].value);
        const quantity = parseInt(form.querySelectorAll('input')[1].value);
        const resId = document.querySelector("#resource-category-list .active")?.dataset.resId;

        // 4. 基础验证
        if (!resId) return alert("请先选择资源！");
        if (isNaN(price) || price <= 0) return alert("请输入有效价格");
        if (isNaN(quantity) || quantity <= 0) return alert("请输入有效数量");
        // 5. 发送请求
        btn.disabled = true; // 防止重复点击
        try {
            const response = await fetch('/api/exchange/order/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    order_type: type, // 'buy' 或 'sell'
                    resource_id: parseInt(resId),
                    price_per_unit: price,
                    quantity: quantity,
                    created_at: Math.floor(Date.now() / 1000)
                })
            });

            if (response.ok) {
                alert(`${type === 'buy' ? '买入' : '卖出'}挂单成功！`);
                // 可选：刷新市场列表或清空输入框
                if (typeof fetchAndRenderInventory === 'function') fetchAndRenderInventory(window.currentUser.id);
            } else {
                const err = await response.json();
                alert("错误: " + (err.detail || "挂单失败"));
            }
        } catch (error) {
            console.error("提交订单出错:", error);
        } finally {
            btn.disabled = false;
        }
    }


</script>

<script>

    let gameExchange;
    document.addEventListener("DOMContentLoaded", async () => {
        // 初始化
        gameWS.subscribe("exchange", (msg) => {
            console.log(msg)
            const { sub_type, data } = msg
            switch (sub_type) {
                case 'snapshot':
                    renderOrderBook(data)
                    break
                case 'order_book':
                    // 委托订单更新
                    renderOrderBook(data)
                    break
                case 'trade_update':
                    // 成交更新
                    onNewTrade(new Date(data.new_trade.time * 1000), data.new_trade.price)
                    renderPriceInfo(data)
                    break
                default:
                    console.warn('ws: unknown exchange subtype', sub_type)
            }
        })

    })
</script>
{% endblock %}
